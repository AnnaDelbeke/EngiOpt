# WandB Sweep: CGAN-2D imgcond on thermoelastic2d — single-weight study
# Trains separate models for each weight value.
# Grid: 5 weights × 3 seeds = 15 runs
method: grid
command:
  - "python"
  - "engiopt/cgan_2d_imgcond/cgan_2d_imgcond.py"
  - "--save_model"
  - "${args}"

metric:
  name: g_loss
  goal: minimize

parameters:
  problem_id:
    value: "thermoelastic2d"

  seed:
    values: [1, 2, 3]

  n_epochs:
    value: 200
  batch_size:
    value: 64
  latent_dim:
    value: 100
  lr_gen:
    value: 0.0001
  lr_disc:
    value: 0.0004

  wandb_project:
    value: "engiopt"

  condition_filter_key:
    value: "weight"
  condition_filter_value:
    values: [0.0, 0.3, 0.5, 0.7, 1.0]
